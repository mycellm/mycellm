[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyphae"
version = "0.1.0"
description = "Distributed coding-agent harness for the Mycellm network"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
hyphae = "hyphae.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hyphae"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: `typer.Option(...)` in argument defaults is the canonical Typer idiom.
"src/hyphae/cli.py" = ["B008"]
