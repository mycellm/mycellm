# mycellm model catalog — bundled fallback.
#
# Live version is fetched from CATALOG_URL (see model_catalog.py) at startup
# and cached locally with a TTL. This file is the offline default.
#
# Schema:
#   catalog_version: ISO date string, used for cache invalidation
#   models[].family:   short slug, used as the canonical name in the recommender
#   models[].variants[]:
#     format:    "mlx" | "gguf"
#     repo:      Hugging Face repo id
#     file:      (gguf only) specific filename inside the repo
#     quant:     human-readable quant tag (Q4_K_M, mxfp4, 4bit, ...)
#     size_gb:   on-disk bytes, GB (10^9)
#     ram_gb:    recommended free RAM headroom in GB
#     platforms: [darwin-arm64, linux-x86_64, linux-aarch64, win-x86_64, ios]

