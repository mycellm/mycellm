# mycellm model catalog — bundled fallback.
#
# Live version is fetched from CATALOG_URL (see model_catalog.py) at startup
# and cached locally with a TTL. This file is the offline default.
#
# Schema:
#   catalog_version: ISO date string, used for cache invalidation
#   models[].family:   short slug, used as the canonical name in the recommender
#   models[].modalities: input modalities, default [text]. Add "image" for
#                        vision-language models — the recommender maps an mlx
#                        variant of a vision family to the "mlx-vlm" backend
#                        (text-only families use "mlx"/"llama.cpp" as before).
#   models[].roles:    capability tags ("reasoning", "coding", "vision", ...)
#   models[].variants[]:
#     format:    "mlx" | "gguf"
#     repo:      Hugging Face repo id
#     file:      (gguf only) specific filename inside the repo
#     quant:     human-readable quant tag (Q4_K_M, mxfp4, 4bit, ...)
#     size_gb:   on-disk bytes, GB (10^9)
#     ram_gb:    recommended free RAM headroom in GB
#     platforms: [darwin-arm64, linux-x86_64, linux-aarch64, win-x86_64, ios]
#
# Note: vision (VLM) families are mlx + darwin-arm64 only for now — the
# llama.cpp backend doesn't wire an mmproj vision projector, and the iOS app
# still uses the text-only prompt path. See mlx_vlm.py / multimodal status.

catalog_version: "2026-07-30"

models:
  - family: qwen3.5-9b
    description: "Qwen 3.5 9B — strong general chat/reasoning for 16GB nodes (hybrid attention; no speculative decoding)"
    roles: [reasoning, coding, chat]
    param_count_b: 9.0
    variants:
      - format: mlx
        repo: lmstudio-community/Qwen3.5-9B-MLX-4bit
        quant: 4bit
        size_gb: 6.0
        ram_gb: 8
        platforms: [darwin-arm64]
      - format: gguf
        repo: unsloth/Qwen3.5-9B-GGUF
        file: Qwen3.5-9B-Q4_K_M.gguf
        quant: Q4_K_M
        size_gb: 5.7
        ram_gb: 8
        platforms: [linux-x86_64, linux-aarch64, darwin-arm64, win-x86_64]

  - family: qwen3.5-2b
